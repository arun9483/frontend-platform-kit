# Reusable nightly audit (consumer wires the cron — workflow_call cannot):
#   - osv-scanner full rescan: catches CVEs disclosed for unchanged dependencies;
#     findings auto-open a GitHub issue labeled sev:<level>.
#   - full e2e suite across all browsers; failure auto-opens an issue.

name: Nightly Audit

on:
  workflow_call:
    inputs:
      osv-version:
        type: string
        required: false
        default: 'v2.3.8'
      playwright-version:
        type: string
        required: false
        default: '1.58.2'
      run-e2e:
        description: Run the full e2e suite (false for library-only repos)
        type: boolean
        required: false
        default: true
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false

jobs:
  osv-rescan:
    name: osv-scanner nightly rescan
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install osv-scanner ${{ inputs.osv-version }}
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${{ inputs.osv-version }}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner

      - name: Scan lockfile
        run: |
          osv-scanner scan source --lockfile=pnpm-lock.yaml \
            --format json --output osv-results.json || true

      # Reports every severity without gating — the nightly's job is visibility,
      # not blocking. Outputs are consumed by the next step.
      - name: Report all findings
        id: osv
        uses: arun9483/frontend-platform-kit/actions/osv-report@v1

      # Separate step: step outputs are only readable after the producing step
      # completes, which is also why the previous inline version (reading a
      # GITHUB_ENV value it had just written) always saw an empty count and
      # never filed anything.
      - name: File or update the tracking issue
        if: ${{ steps.osv.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.osv.outputs.count }}
          LEVEL: ${{ steps.osv.outputs.level }}
          BODY_FILE: ${{ steps.osv.outputs['summary-file'] }}
        run: |
          gh label create "osv-scan" --force --color B60205 \
            --description "Automated dependency vulnerability scan" --repo "$GITHUB_REPOSITORY"
          gh label create "sev:$LEVEL" --force --color B60205 \
            --description "Max severity of automated security finding" --repo "$GITHUB_REPOSITORY"

          title="Dependency vulnerabilities: $COUNT package(s), max severity $LEVEL"
          # One living issue rather than a new one each night.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label "osv-scan" --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$BODY_FILE" --add-label "sev:$LEVEL"
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Rescanned $(date -u +%F): $COUNT finding(s), max severity $LEVEL."
            echo "Updated issue #$existing ($COUNT finding(s), sev:$LEVEL)."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --label "osv-scan" --label "sev:$LEVEL" --body-file "$BODY_FILE"
            echo "Filed new issue ($COUNT finding(s), sev:$LEVEL)."
          fi

      - name: Close the tracking issue when clean
        if: ${{ steps.osv.outputs.count == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label "osv-scan" --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "All previously reported dependency vulnerabilities are resolved as of $(date -u +%F)."
            echo "Closed issue #$existing."
          else
            echo "No known vulnerabilities at any severity."
          fi

  full-e2e:
    name: full e2e (all browsers)
    if: ${{ inputs.run-e2e }}
    uses: arun9483/frontend-platform-kit/.github/workflows/ux-regression.yml@v1
    with:
      e2e-args: ''
      playwright-version: ${{ inputs.playwright-version }}
      issue-on-failure: true
    secrets: inherit
