# Reusable security gate: osv-scanner (dependency vulnerabilities, blocking at
# high+ severity) and gitleaks (secret scanning over full git history).
#
# Waivers: osv ignores go in the consumer's osv-scanner.toml with justification,
# owner, and expiry <= 90 days. No permanent exceptions.

name: Security

on:
  workflow_call:
    inputs:
      severity-threshold:
        description: Minimum CVSS score that fails the build (7.0 = high)
        type: string
        required: false
        default: '7.0'
      osv-version:
        type: string
        required: false
        default: 'v2.3.8'
      gitleaks-version:
        type: string
        required: false
        default: '8.30.1'

jobs:
  dependency-vulnerabilities:
    name: osv-scanner (fail at high+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install osv-scanner ${{ inputs.osv-version }}
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${{ inputs.osv-version }}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner

      - name: Scan lockfile
        run: |
          osv-scanner scan source --lockfile=pnpm-lock.yaml \
            --format json --output osv-results.json || true
          osv-scanner scan source --lockfile=pnpm-lock.yaml --format table || true

      # Reports every finding at every severity to the run summary, then fails
      # only at/above the consumer's threshold.
      - name: Report all findings, gate at >= ${{ inputs.severity-threshold }}
        uses: arun9483/frontend-platform-kit/actions/osv-report@v1
        with:
          fail-at: ${{ inputs.severity-threshold }}

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osv-results
          path: osv-results.json
          retention-days: 30

  secret-scan:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks ${{ inputs.gitleaks-version }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${{ inputs.gitleaks-version }}/gitleaks_${{ inputs.gitleaks-version }}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan repository history
        run: gitleaks detect --source . --redact --no-banner
