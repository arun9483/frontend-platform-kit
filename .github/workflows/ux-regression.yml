# Reusable UX integrity gate: Playwright e2e journeys + axe accessibility checks
# + visual snapshots, run inside the pinned Playwright container so screenshot
# baselines are font-stable (Linux). Baselines are ALWAYS generated by CI via
# the update-snapshots mode (label-triggered in the consumer) — never on macOS.
#
# Consumer contract: root script `test:e2e` (turbo) that forwards extra args to
# `playwright test`, and `build` producing the app the e2e webServer starts.

name: UX Regression

on:
  workflow_call:
    inputs:
      e2e-args:
        description: Extra args forwarded to `playwright test` (e.g. "--project=chromium")
        type: string
        required: false
        default: '--project=chromium'
      playwright-version:
        description: Must match the consumer's pinned @playwright/test version
        type: string
        required: false
        default: '1.58.2'
      update-snapshots:
        description: Regenerate visual baselines and push them to the PR branch
        type: boolean
        required: false
        default: false
      issue-on-failure:
        description: Open a GitHub issue when the run fails (merge-to-main / nightly)
        type: boolean
        required: false
        default: false
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false

jobs:
  e2e:
    name: e2e + axe + visual (${{ inputs.update-snapshots && 'update baselines' || inputs.e2e-args }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ inputs.playwright-version }}-noble
    permissions:
      contents: write
      issues: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      HOME: /root
      # GitHub container jobs don't propagate the image's ENV to steps — point
      # Playwright at the browsers baked into the image explicitly.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.update-snapshots && github.event.pull_request.head.ref || '' }}

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup
        uses: arun9483/frontend-platform-kit/actions/setup-node-pnpm@v1

      - name: Build
        run: pnpm build

      # NOTE: no `--` before the args — pnpm forwards `--` literally to the
      # script; the consumer's root script ends with `--` for turbo passthrough.
      - name: Run e2e
        if: ${{ !inputs.update-snapshots }}
        run: pnpm test:e2e ${{ inputs.e2e-args }}

      - name: Regenerate visual baselines
        if: ${{ inputs.update-snapshots }}
        run: pnpm test:e2e ${{ inputs.e2e-args }} --update-snapshots

      - name: Commit updated baselines to PR branch
        if: ${{ inputs.update-snapshots }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage whichever snapshot convention the consumer uses (default
          # *-snapshots dirs or a custom __screenshots__ snapshotPathTemplate);
          # an unmatched pathspec must not fail the job.
          for p in '*-snapshots/*' '*__screenshots__*'; do
            git add -A -- "$p" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "No baseline changes."
          else
            # --no-verify: consumer husky hooks are developer-machine gates and
            # break in CI (e.g. pre-push turbo --filter='...[origin/main]' has
            # no origin/main ref in the container checkout). CI is its own gate.
            git commit --no-verify -m "chore(e2e): update visual baselines [skip ci]"
            git push --no-verify
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

      - name: Open issue on failure
        if: ${{ failure() && inputs.issue-on-failure }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "ux-regression" --force --color D93F0B \
            --description "Automated UX regression finding" --repo "$GITHUB_REPOSITORY"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "UX regression run failed (${{ inputs.e2e-args }}) — $(date -u +%F)" \
            --label "ux-regression" \
            --body "Automated run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
